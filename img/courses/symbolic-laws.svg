<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="sr-art-title">
<title id="sr-art-title">An expression tree for a formula next to noisy measurements, with the curve of the formula passing through them</title>
<rect width="800" height="340" fill="#F3F7FC"/>
<g stroke="#E2E8F0" stroke-width="1">
<path d="M0 40H800M0 80H800M0 120H800M0 160H800M0 200H800M0 240H800M0 280H800M0 320H800"/>

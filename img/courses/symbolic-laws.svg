<circle cx="262" cy="212" r="23" fill="#2563EB"/><text x="262" y="220" font-size="21" fill="#FFFFFF">×</text>
<circle cx="215" cy="276" r="23" fill="#FFFFFF" stroke="#334155" stroke-width="2.4"/><text x="215" y="283" font-size="18" fill="#0F172A">−k</text>
<circle cx="309" cy="276" r="23" fill="#FFFFFF" stroke="#334155" stroke-width="2.4"/><text x="309" y="283" font-size="19" fill="#0F172A">t</text>
</g>

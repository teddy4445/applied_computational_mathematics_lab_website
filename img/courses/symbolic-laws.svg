</g>
<circle cx="205" cy="178" r="150" fill="#E8F0FB"/>
<!-- expression tree: a × exp(−k × t) -->
<g stroke="#334155" stroke-width="2.4" fill="none" stroke-linecap="round">
<path d="M205 78L140 150M205 78L262 150M262 150L262 212M262 212L215 276M262 212L309 276"/>
</g>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" text-anchor="middle">
